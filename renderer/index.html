<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>JapAlpha</title>
    <link rel="stylesheet" href="styles.css" />
    <script>
      // Apply saved settings before first paint to avoid a flash.
      document.documentElement.dataset.theme =
        localStorage.getItem("japalpha-theme") || "default";
      document.documentElement.dataset.colorful =
        localStorage.getItem("japalpha-colorful") || "0";
      document.documentElement.style.setProperty(
        "--ui-scale",
        localStorage.getItem("japalpha-scale") || "1",
      );
    </script>
  </head>
  <body>
    <header>
      <div id="navs">
        <nav id="view-tabs">
          <button class="view-tab active" data-view="practice">Practice</button>
          <button class="view-tab" data-view="quiz">Quiz</button>
        </nav>
        <nav id="tabs">
          <button class="tab active" data-mode="hiragana">Hiragana</button>
          <button class="tab" data-mode="katakana">Katakana</button>
          <button class="tab" data-mode="kanji">Kanji</button>
        </nav>
      </div>
      <div id="header-right">
        <div id="score">Card 1 / 104</div>
        <div id="settings-wrap">
          <button id="settings-btn" class="icon-btn" title="Settings">⚙</button>
          <div id="settings-panel" class="hidden">
            <label
              >Theme
              <select id="theme-select">
                <option value="default">Default</option>
                <option value="dracula">Dracula</option>
                <option value="nord">Nord</option>
                <option value="monokai">Monokai</option>
                <option value="solarized">Solarized Dark</option>
                <option value="gruvbox">Gruvbox Dark</option>
                <option value="light">Light</option>
              </select>
            </label>
            <label
              >Size
              <select id="scale-select">
                <option value="0.85">Compact (85%)</option>
                <option value="1" selected>Default (100%)</option>
                <option value="1.25">Large (125%)</option>
                <option value="1.5">Extra large (150%)</option>
              </select>
            </label>
            <label class="check-row">
              <input type="checkbox" id="colorful-check" />
              Colorful characters &amp; romaji
            </label>
          </div>
        </div>
      </div>
    </header>

    <section id="filters">
      <div id="kana-filters" class="filter-group">
        <label
          ><input type="checkbox" data-kana="basic" checked /> Basic (46)</label
        >
        <label
          ><input type="checkbox" data-kana="dakuten" checked /> Dakuten /
          Handakuten</label
        >
        <label><input type="checkbox" data-kana="yoon" checked /> Yōon</label>
      </div>

      <div id="kanji-filters" class="filter-group hidden">
        <div class="row">
          <label
            >Lists:
            <select id="kanji-source">
              <option value="grade">School grades (Kyōiku)</option>
              <option value="jlpt">JLPT levels</option>
            </select>
          </label>
        </div>
        <div class="row" id="kanji-levels"></div>
      </div>
    </section>

    <main>
      <div id="practice-view">
        <div id="practice-card">
          <div id="practice-char">あ</div>
          <div id="practice-details">
            <div id="practice-reading"></div>
            <div id="practice-meaning"></div>
            <div id="practice-readings"></div>
          </div>
        </div>
        <div id="practice-controls">
          <button id="practice-prev" class="nav-btn">← Prev</button>
          <button id="practice-shuffle" class="nav-btn">Shuffle</button>
          <button id="practice-next" class="nav-btn">Next →</button>
        </div>
      </div>

      <div id="quiz-view" class="hidden">
        <div id="prompt-wrap">
          <div id="prompt">あ</div>
          <div id="hint"></div>
        </div>
        <div id="choices"></div>
        <div id="controls">
          <button id="skip">Skip →</button>
        </div>
      </div>
    </main>

    <script src="data/kana.js"></script>
    <script src="data/kanji.js"></script>
    <script src="app.js"></script>
  </body>
</html>
